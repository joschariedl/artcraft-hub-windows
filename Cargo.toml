[workspace]
resolver = "2"
members = [
    "crates/artcraft-core",
    "crates/artcraft-hub",
    "crates/artcraftctl",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Joscha Riedl"]
repository = "https://github.com/joschariedl/artcraft-hub-windows"

[workspace.dependencies]
artcraft-core = { path = "crates/artcraft-core" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
dirs = "7.0"
flate2 = "1.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
libc = "0.2"
percent-encoding = "2.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
ureq = { version = "3.5", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
